name: ci
on: { push: { branches: ['**'] }, pull_request: }
concurrency: { group: ci-${{ github.ref }}, cancel-in-progress: true }
jobs:
  verify:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: pro-prompt-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: pro-prompt-engine/package-lock.json }
      - run: npm ci
      - run: npm run compile              # tsc --noEmit, strict
      - run: npm run test:unit -- --coverage
      - run: npm run build                # wxt build → .output/chrome-mv3
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run -a npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: pro-prompt-engine/playwright-report/, retention-days: 7 }
