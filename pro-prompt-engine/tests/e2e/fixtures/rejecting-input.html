<!doctype html>

<html lang="en">
<head><meta charset="utf-8"><title>Rejecting input fixture</title></head>
<body>
  <h1>A field that refuses every write</h1>
  <label for="stubborn">Reference code</label>
  <input id="stubborn" type="text" value="" autocomplete="off" />

    document.getElementById('stubborn').addEventListener('input', (e) => {
      e.target.value = '';
