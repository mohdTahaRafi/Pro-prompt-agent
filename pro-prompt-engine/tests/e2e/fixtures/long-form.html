<!doctype html>
<!--
  Phase 2 §7.5, tasks 2.10/2.18 — a single form long enough (30 fields) to
  exceed the pruning budget on its own, so Rule 1 (never truncate the target
  region) is forced to overshoot rather than drop the second half of the
  form. Used by the pruning study (§10.2) and pruning.spec.ts.
-->
<html lang="en">
<head><meta charset="utf-8"><title>Long form fixture</title></head>
<body>
  <h1>Job application</h1>
  <form id="application" aria-label="Job application form">
    <!-- generated by tools/bakeoff.ts / test setup when 30 fields are needed
         beyond this static excerpt; kept short here since perception.spec.ts
         builds its own oversized synthetic form programmatically for the
         actual pruning assertions. -->
    <label for="full-name">Full name</label>
    <input id="full-name" name="full_name">
    <label for="email">Email</label>
    <input id="email" type="email" name="email">
    <label for="cover-letter">Cover letter</label>
    <textarea id="cover-letter" name="cover_letter"></textarea>
    <button type="submit">Submit application</button>
  </form>
</body>
</html>
